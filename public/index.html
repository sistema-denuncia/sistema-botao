<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>Acionamento de emergência</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header class="cabecalho">
            <span class="sinalizador" aria-hidden="true"></span>
            <p class="eyebrow">OPERAÇÃO DE EMERGÊNCIA</p>
            <h1>Botão de emergência</h1>
            <p class="subtitulo">Acione a central quando precisar de atendimento imediato.</p>
        </header>

        <section class="painel-acionamento" aria-label="Acionamento de emergência">
            <button id="btnEmergencia" type="button" aria-describedby="instrucao status">
                <span class="icone-alerta" aria-hidden="true">!</span>
                <span class="texto-botao">TOQUE PARA ALERTAR</span>
            </button>
            <p class="instrucao" id="instrucao">O alerta será enviado com a localização disponível.</p>
            <div class="status-box" data-tipo="" aria-live="polite">
                <span class="status-ponto" aria-hidden="true"></span>
                <p id="status">Aguardando acionamento.</p>
            </div>
        </section>

        <footer class="rodape"><span class="cadeado" aria-hidden="true">●</span> Sistema protegido para agentes autorizados</footer>
    </main>
    <script src="api.js"></script>
    <script src="client.js"></script>
</body>
</html>
