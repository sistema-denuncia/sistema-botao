<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One Touch - Cadastro de Usuário</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="app-header">
    <h1>🚨 One Touch</h1>
    <p class="tagline">Cadastro Único de Segurança e Emergência</p>
  </header>

  <main class="main-container form-wrapper">
    <div class="form-panel single-panel">
      <h2 style="margin-bottom: 20px; text-align: center;">Cadastro Pessoal</h2>
      
      <form id="cadastroForm">
        
        <!-- 1. Nome e Sobrenome na mesma caixa -->
        <div class="form-group">
          <label for="nomeCompleto">Nome e Sobrenome</label>
          <input type="text" id="nomeCompleto" placeholder="Ex: Maria Silva" required>
        </div>

        <!-- 2. CPF -->
        <div class="form-group">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" required>
        </div>

        <!-- 3. Data de Nascimento (3 caixas DD/MM/AAAA + Botão de Calendário) -->
        <div class="form-group">
          <label>Data de Nascimento</label>
          <div class="date-inputs">
            <input type="text" id="dia" placeholder="DD" readonly required>
            <input type="text" id="mes" placeholder="MM" readonly required>
            <input type="text" id="ano" placeholder="AAAA" readonly required>
            <button type="button" class="calendar-trigger" id="openCalendar" title="Selecionar Data">📅</button>
          </div>
          <!-- Campo nativo de data oculto para controle do calendário -->
          <input type="date" id="hiddenDatePicker" style="display: none;">
        </div>

        <!-- 4. E-mail e Confirmação de E-mail -->
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="seu.email@exemplo.com" required>
        </div>

        <div class="form-group">
          <label for="confirmarEmail">Confirmar E-mail</label>
          <input type="email" id="confirmarEmail" placeholder="Confirme seu e-mail" required>
        </div>

        <!-- 5. Senha e Confirmação de Senha -->
        <div class="form-group">
          <label for="senha">Cadastrar Senha</label>
          <input type="password" id="senha" placeholder="••••••••" minlength="6" required>
        </div>

        <div class="form-group">
          <label for="confirmarSenha">Confirmar Senha</label>
          <input type="password" id="confirmarSenha" placeholder="••••••••" minlength="6" required>
        </div>

        <!-- Botão de Confirmação com a mesma cor padrão -->
        <button type="submit" class="btn-primary">Concluir Cadastro</button>

        <div class="register-prompt">
          <p>Já possui uma conta? <a href="login-usuario.html">Voltar para o Login</a></p>
        </div>

      </form>
    </div>
  </main>

  <script src="/js/cadastro.js"></script>
</body>
</html>
