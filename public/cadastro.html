<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One Touch - Cadastro de Usuário</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="app-header">
    <h1>🚨 One Touch</h1>
    <p class="tagline">Cadastro Único de Segurança e Emergência</p>
  </header>

  <main class="main-container form-wrapper">
    <div class="form-panel single-panel">
      <h2 style="margin-bottom: 20px; text-align: center;">Cadastro Pessoal</h2>
      
      <form id="cadastroForm">
        
        <!-- 1. Nome e Sobrenome na mesma caixa -->
        <div class="form-group">
          <label for="nomeCompleto">Nome e Sobrenome</label>
          <input type="text" id="nomeCompleto" placeholder="Ex: Maria Silva" autocomplete="name" maxlength="120" required>
        </div>

        <!-- 2. CPF -->
        <div class="form-group">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" required>
        </div>

        <!-- 3. Data de nascimento -->
        <fieldset class="form-group date-fieldset" aria-describedby="dataNascimentoAjuda">
          <legend>Data de nascimento</legend>
          <div class="date-inputs">
            <div class="date-input-group">
              <label for="dia">Dia</label>
              <input type="text" id="dia" placeholder="DD" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="bday-day" aria-label="Dia de nascimento" required>
            </div>
            <div class="date-input-group">
              <label for="mes">Mês</label>
              <input type="text" id="mes" placeholder="MM" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="bday-month" aria-label="Mês de nascimento" required>
            </div>
            <div class="date-input-group">
              <label for="ano">Ano</label>
              <input type="text" id="ano" placeholder="AAAA" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="bday-year" aria-label="Ano de nascimento" required>
            </div>
            <button type="button" class="calendar-trigger" id="openCalendar" title="Selecionar data de nascimento" aria-label="Selecionar data de nascimento pelo calendário">📅</button>
          </div>
          <small id="dataNascimentoAjuda">Digite a data ou use o calendário. É necessário ter pelo menos 18 anos.</small>
          <input type="date" id="hiddenDatePicker" class="date-picker-hidden" aria-label="Calendário de data de nascimento" tabindex="-1">
        </fieldset>

        <!-- 4. E-mail e Confirmação de E-mail -->
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="seu.email@exemplo.com" required>
        </div>

        <div class="form-group">
          <label for="confirmarEmail">Confirmar E-mail</label>
          <input type="email" id="confirmarEmail" placeholder="Confirme seu e-mail" required>
        </div>

        <!-- 5. Senha e Confirmação de Senha -->
        <div class="form-group">
          <label for="senha">Cadastrar Senha</label>
          <input type="password" id="senha" placeholder="••••••••" minlength="8" autocomplete="new-password" aria-describedby="senhaAjuda" required>
          <small id="senhaAjuda">Use pelo menos 8 caracteres, com uma letra maiúscula e uma minúscula.</small>
        </div>

        <div class="form-group">
          <label for="confirmarSenha">Confirmar Senha</label>
          <input type="password" id="confirmarSenha" placeholder="••••••••" minlength="8" autocomplete="new-password" required>
        </div>

        <!-- Botão de Confirmação com a mesma cor padrão -->
        <button type="submit" class="btn-primary">Concluir Cadastro</button>

        <div class="register-prompt">
          <p id="mensagemCadastro" role="status" aria-live="polite"></p>
          <p>Já possui uma conta? <a href="/login">Voltar para o Login</a></p>
        </div>

      </form>
    </div>
  </main>

  <script src="/js/name-validation.js"></script>
  <script src="/js/password-validation.js"></script>
  <script src="/js/birth-date-validation.js"></script>
  <script src="/js/cadastro.js"></script>
</body>
</html>
